<!DOCTYPE HTML>
<html lang="en">

<head>


	
		<!-- Fonts -->
	
	<link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Band Landing Page</title>
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('images/owen_bg.jpg'); /* Replace with your background image */
            background-size: cover;
            background-position: center;
            color: white;
            font-family: Arial, sans-serif;
        }

        #page-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }

        #content {
            background: rgba(0, 0, 0, 0.6); /* Adds a dark overlay for readability */
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .album-image {
            max-width: 400px;
            margin: 20px 0;
        }

        .new-releases {
            font-size: 1.5rem;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100px;
            margin-top: 20px;
        }
    </style>

<body>

    <div id="page-wrapper">
        <div id="content">
            <!-- Band Name -->
			<h1 id="band-name">BRAVE DAISY</h1>

            <!-- Album Image -->
            <div class="album-image">
				<img id="album-cover" src="images/another_man_cover.jpg" alt="Album Cover">
            </div>

            <!-- New Releases Section -->
            <div class="new-releases">
                <p>New Releases</p>
            </div>

            <!-- Embedded Spotify Song -->
        	<div class="track-container">
            	<iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/2kxwm9yLV5yK7L8GpkrUiz?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

        </div>
